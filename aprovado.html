<script>
(function(){
  var nome = (localStorage.getItem('nome') || 'customer').trim();
  var p = nome.split(/\s+/);
  var first = (p[0]||'customer').toLowerCase();
  var last  = (p.slice(-1)[0]||'').toLowerCase();
  document.getElementById('userName').textContent = first + (last && last!==first ? ' '+last : '');
  document.getElementById('firstName').textContent = first;

  var nif = (localStorage.getItem('nif') || '').replace(/\D/g,'');
  if(nif.length>=9) document.getElementById('userNif').textContent = nif.slice(0,3)+' *** *'+nif.slice(7,9);

  var fmtEUR = function(n){ return '€ ' + (+n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var valor = +(localStorage.getItem('valorEmprestimo')||0);
  var parcelas = +(localStorage.getItem('parcelas')||0);
  var valorParcela = +(localStorage.getItem('valorParcela')||0);

  document.getElementById('valorLib').textContent = fmtEUR(valor);
  document.getElementById('prestacaoMensal').textContent = fmtEUR(valorParcela);
  document.getElementById('prestacoesQtd').textContent = parcelas + 'x';

  // first installment
  var quando = (localStorage.getItem('primeiraPrestacao')||'').toLowerCase();
  var dias = 30, hintTxt = '30 days until your first payment!';
  if(quando.indexOf('next month')>-1){ dias = 30; hintTxt='next month'; }
  else if(quando.indexOf('30')>-1){ dias = 30; hintTxt='30 days until your first payment!'; }
  else if(quando.indexOf('60')>-1){ dias = 60; hintTxt='60 days until your first payment!'; }
  else if(quando.indexOf('90')>-1){ dias = 90; hintTxt='90 days until your first payment!'; }

  var d = new Date(); d.setDate(d.getDate()+dias);
  var dd = ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
  document.getElementById('primeiraData').textContent = dd;
  document.getElementById('primeiraHint').textContent = hintTxt;
})();
</script>
