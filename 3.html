<script>
  // Show name + National ID Number in header
  (function () {
    const nome = localStorage.getItem('nome') || '';
    const nif  = localStorage.getItem('nif')  || '';
    if (nome) {
      const first = nome.trim().split(/\s+/)[0] || '';
      const last  = nome.trim().split(/\s+/).slice(-1)[0] || '';
      const label = (first + (last && last !== first ? ' ' + last : '')).toLowerCase()
        .replace(/\b\w/g, c => c.toUpperCase());
      document.getElementById('userName').textContent = label;
    }
    if (nif) {
      const digits = nif.replace(/\D/g, '');
      if (digits.length >= 5) {
        document.getElementById('userNif').textContent =
          digits.slice(0,3) + ' *** ' + digits.slice(-3);
      }
    }
  })();

  const grid = document.getElementById('grid');
  const btn  = document.getElementById('btnNext');
  let selected = null;

  grid.addEventListener('click', (e) => {
    const opt = e.target.closest('.opt');
    if (!opt) return;
    grid.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    selected = opt.dataset.value;
    btn.classList.add('enabled');
  });

  btn.addEventListener('click', () => {
    if (!selected) return;
    localStorage.setItem('finalidade', selected);
    btn.classList.add('loading');
    const p = new URLSearchParams(window.location.search);
    p.set('finalidade', selected);
    setTimeout(() => {
      window.location.href = '4.html?' + p.toString();
    }, 600);
  });
</script>
